<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Paylaşımlar taşındı</title>
<meta http-equiv="refresh" content="0; url=../">
<script>
  // Eski ayrı uygulamanın önbelleğini temizle, Şirket uygulamasına geç.
  if ("serviceWorker" in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => { if (r.scope.endsWith("/paylasim/")) r.unregister(); }));
  location.replace("../");
</script>
</head>
<body>Paylaşımlar artık Şirket uygulamasının "Paylaşım" sekmesinde. <a href="../">Şirket uygulamasını aç</a></body>
</html>
