<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Paylaşımlar">
<meta name="theme-color" content="#F4F2EE">
<title>Paylaşımlar</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F2EE; --card: #FFFFFF; --ink: #1C1917; --muted: #57534E; --line: #E7E5E4;
    --done: #16A34A; --done-bg: #DCFCE7; --done-ink: #14532D;
    --ready: #FACC15; --ready-bg: #FEF9C3; --ready-ink: #713F12;
    --todo: #DC2626; --todo-bg: #FEE2E2; --todo-ink: #991B1B;
    --unk: #A8A29E; --unk-bg: #F5F5F4; --unk-ink: #57534E;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, -apple-system, system-ui, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 28px); max-width: 560px; margin: 0 auto; }
  button { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* giris */
  .login { min-height: 80vh; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .login h1 { margin: 0 0 4px; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .login p { margin: 0 0 8px; color: var(--muted); font-size: 15px; line-height: 1.45; }
  .login label { font-size: 13px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; gap: 6px; }
  .login input { height: 48px; border-radius: 14px; border: 1px solid var(--line); background: #fff; padding: 0 14px; font: 500 16px Inter, sans-serif; color: var(--ink); }
  .primary { height: 50px; border-radius: 14px; border: none; background: var(--ink); color: #fff; font-weight: 700; font-size: 16px; cursor: pointer; }
  .err { color: var(--todo-ink); background: var(--todo-bg); padding: 10px 12px; border-radius: 12px; font-size: 14px; }

  /* ust */
  .top { display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 0; }
  .top .date { font-size: 13px; font-weight: 600; color: var(--muted); }
  .top h1 { margin: 2px 0 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
  .ring { width: 72px; height: 72px; border-radius: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ring > div { width: 54px; height: 54px; border-radius: 27px; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring b { font-size: 17px; font-weight: 800; line-height: 1; }
  .ring span { font-size: 10px; font-weight: 600; color: var(--muted); margin-top: 2px; }

  .bar { display: flex; align-items: center; gap: 8px; margin: 16px 0 12px; }
  .daynav { display: flex; align-items: center; background: #fff; border-radius: 14px; border: 1px solid var(--line); }
  .daynav button { width: 44px; height: 40px; border: none; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .daynav span { font-size: 14px; font-weight: 700; min-width: 64px; text-align: center; }
  .seg { display: flex; background: #E7E5E4; border-radius: 12px; padding: 3px; margin-left: auto; }
  .seg button { height: 34px; padding: 0 12px; border: none; border-radius: 9px; background: none; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .iconbtn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .iconbtn.spin svg { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .next { background: var(--ink); color: #fff; border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .next .t { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .next .l { font-size: 13px; line-height: 1.35; color: #E7E5E4; }
  .next .l b { color: #fff; }

  .probs { background: #fff; border-radius: 22px; padding: 14px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 1px 2px rgba(28,25,23,0.06); }
  .probs h2 { margin: 0; font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .probs h2 i { font-style: normal; background: var(--todo); color: #fff; border-radius: 10px; font-size: 12px; padding: 2px 8px; }
  .prob { border: none; background: var(--todo-bg); border-radius: 14px; padding: 10px 12px; text-align: left; display: flex; flex-direction: column; gap: 3px; cursor: pointer; width: 100%; }
  .prob .w { font-size: 12px; font-weight: 700; color: var(--todo-ink); }
  .prob .r { font-size: 15px; font-weight: 800; color: var(--ink); }
  .prob .f { font-size: 13px; line-height: 1.4; color: var(--muted); }
  .sheet .fix { font-size: 14px; line-height: 1.5; color: var(--ink); background: var(--unk-bg); border-radius: 12px; padding: 10px 12px; }
  .sheet .raw { font-size: 12px; line-height: 1.4; color: var(--muted); }
  .notice { background: #fff; border: 1px dashed #D6D3D1; color: var(--muted); border-radius: 14px; padding: 10px 12px; font-size: 13px; line-height: 1.4; margin-bottom: 12px; }

  /* marka karti */
  .cards { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 1px 2px rgba(28,25,23,0.06); }
  .head { display: flex; align-items: center; gap: 12px; }
  .logo { position: relative; width: 50px; height: 50px; border-radius: 14px; flex-shrink: 0; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; overflow: hidden; }
  .logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .head .n { font-size: 17px; font-weight: 800; }
  .head .s { font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .head .badge { margin-left: auto; width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .rows { display: flex; flex-direction: column; gap: 8px; }
  .row { display: flex; align-items: flex-start; gap: 10px; }
  .plat { display: flex; align-items: center; gap: 8px; width: 96px; flex-shrink: 0; padding-top: 5px; }
  .pdot { width: 24px; height: 24px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .plat span { font-size: 12px; font-weight: 700; line-height: 1.2; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
  .chip { height: 34px; min-width: 68px; padding: 0 6px 0 8px; border-radius: 12px; border: none; display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; cursor: pointer; }
  .chip .st { width: 20px; height: 20px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .chip.extra { box-shadow: inset 0 0 0 1.5px rgba(0,0,0,0.12); }
  .chip.done { background: var(--done-bg); color: var(--done-ink); } .chip.done .st { background: var(--done); }
  .chip.ready { background: var(--ready-bg); color: var(--ready-ink); } .chip.ready .st { background: var(--ready); }
  .chip.todo { background: var(--todo-bg); color: var(--todo-ink); } .chip.todo .st { background: var(--todo); }
  .chip.unknown { background: var(--unk-bg); color: var(--unk-ink); } .chip.unknown .st { background: var(--unk); }

  .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 16px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  .foot button { border: none; background: none; color: var(--muted); text-decoration: underline; font-size: 12px; cursor: pointer; min-height: 44px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; }

  /* detay */
  .sheet-bg { position: fixed; inset: 0; background: rgba(28,25,23,0.35); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: #fff; width: 100%; max-width: 560px; border-radius: 22px 22px 0 0; padding: 18px 18px calc(env(safe-area-inset-bottom) + 18px); display: flex; flex-direction: column; gap: 10px; }
  .sheet .k { font-size: 13px; font-weight: 600; color: var(--muted); }
  .sheet .big { font-size: 20px; font-weight: 800; }
  .sheet .pill { align-self: flex-start; font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 10px; }
  .sheet .ttl { font-size: 15px; line-height: 1.45; }
</style>
</head>
<body>

<section id="login" class="login hidden">
  <h1>Paylaşımlar</h1>
  <p>Şirket uygulamasındaki e-posta ve şifrenle gir. Sadece sen görebilirsin.</p>
  <label>E-posta<input id="email" type="email" autocomplete="username" inputmode="email"></label>
  <label>Şifre<input id="pass" type="password" autocomplete="current-password"></label>
  <div id="loginErr" class="err hidden"></div>
  <button id="loginBtn" class="primary">Giriş yap</button>
</section>

<section id="app" class="hidden">
  <header class="top">
    <div>
      <div class="date" id="dateLabel"></div>
      <h1>Kanallarım</h1>
    </div>
    <div class="ring" id="ring" role="img" aria-label="Günün ilerlemesi"><div><b id="ringTxt">0/0</b><span>tamam</span></div></div>
  </header>

  <div class="bar">
    <div class="daynav">
      <button id="prevDay" aria-label="Önceki gün"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1917" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <span id="dayName">Bugün</span>
      <button id="nextDay" aria-label="Sonraki gün"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1C1917" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="seg" role="group" aria-label="Filtre">
      <button id="fAll" class="on">Tümü</button>
      <button id="fMiss">Eksikler</button>
    </div>
    <button id="refresh" class="iconbtn" aria-label="Yenile"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1917" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  </div>

  <div id="next" class="next hidden"></div>
  <div id="probs" class="probs hidden"></div>
  <div id="notices"></div>
  <div id="cards" class="cards"></div>
  <div class="foot">
    <span id="updated"></span>
    <button id="logout">Çıkış yap</button>
  </div>
</section>

<div id="sheet" class="sheet-bg hidden" role="dialog" aria-modal="true">
  <div class="sheet" id="sheetBody"></div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://eqqtmcmrapbgiscxncht.supabase.co";
const SUPABASE_KEY = "sb_publishable_rPcyVH_IS4ulof8vWF-f9w_NUzfOnFl";
const FN = SUPABASE_URL + "/functions/v1/paylasim";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "paylasim-auth" } });

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const PLAT = {
  yt: { color: "#E11D1D", svg: '<svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z" fill="#fff"/></svg>' },
  ig: { color: "#C1358A", svg: '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.6"/></svg>' },
  tt: { color: "#111111", svg: '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M13 4v11a3.5 3.5 0 1 1-3.5-3.5"/><path d="M13 4c.6 2.6 2.6 4.2 5 4.4"/></svg>' },
  x: { color: "#111111", svg: '<svg aria-hidden="true" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>' },
};
const ST = {
  done: { label: "Paylaşıldı", svg: '<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' },
  ready: { label: "Hazır, bekliyor", svg: '<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#422006" stroke-width="2.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4.5l3 2"/></svg>' },
  todo: { label: "Hazırlanmadı", svg: '<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M12 6.5v7"/><path d="M12 17.5v.01"/></svg>' },
  unknown: { label: "Bilinmiyor", svg: '<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.4"/><path d="M12 17.5v.01"/></svg>' },
};
const DAYS = ["Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"];
const MONTHS = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];

const todayStr = () => new Date(Date.now() + 3 * 3600e3).toISOString().slice(0, 10);
const shift = (d, n) => new Date(Date.parse(d + "T12:00:00Z") + n * 86400e3).toISOString().slice(0, 10);

let state = { date: todayStr(), filter: "all", data: null, loading: false };
const demo = location.hash === "#demo";

// ------------------------------------------------ oturum
async function start() {
  if (demo) return showApp();
  const { data } = await sb.auth.getSession();
  if (data.session) showApp(); else showLogin();
}
function showLogin() { $("#login").classList.remove("hidden"); $("#app").classList.add("hidden"); }
function showApp() { $("#login").classList.add("hidden"); $("#app").classList.remove("hidden"); load(); }

$("#loginBtn").onclick = async () => {
  const btn = $("#loginBtn"); btn.disabled = true; btn.textContent = "Giriliyor…";
  $("#loginErr").classList.add("hidden");
  const { error } = await sb.auth.signInWithPassword({ email: $("#email").value.trim(), password: $("#pass").value });
  btn.disabled = false; btn.textContent = "Giriş yap";
  if (error) { $("#loginErr").textContent = "Giriş olmadı: e-posta ya da şifre yanlış."; $("#loginErr").classList.remove("hidden"); return; }
  showApp();
};
$("#logout").onclick = async () => { await sb.auth.signOut(); state.data = null; showLogin(); };

// ------------------------------------------------ veri
async function load(force = false) {
  if (state.loading) return;
  state.loading = true; $("#refresh").classList.add("spin");
  try {
    let data;
    if (demo) data = await fetch("sample.json").then((r) => r.json());
    else {
      const { data: s } = await sb.auth.getSession();
      if (!s.session) { showLogin(); return; }
      const res = await fetch(FN, {
        method: "POST",
        headers: { "Content-Type": "application/json", Authorization: "Bearer " + s.session.access_token, apikey: SUPABASE_KEY },
        body: JSON.stringify({ date: state.date, force }),
      });
      data = await res.json();
      if (res.status === 401) { showLogin(); return; }
      if (!res.ok) throw new Error(data.error || res.status);
    }
    state.data = data;
    try { localStorage.setItem("paylasim-last-" + state.date, JSON.stringify(data)); } catch {}
  } catch (e) {
    let cached = null;
    try { cached = JSON.parse(localStorage.getItem("paylasim-last-" + state.date) || "null"); } catch {}
    state.data = cached;
    state.error = "Güncel veri alınamadı (" + (e.message || e) + "). " + (cached ? "Son kayıtlı durum gösteriliyor." : "");
  } finally {
    state.loading = false; $("#refresh").classList.remove("spin");
    render();
    state.error = null;
  }
}

// ------------------------------------------------ cizim
function chip(b, r, s, i, j) {
  return `<button class="chip ${s.status}${s.extra ? " extra" : ""}" data-b="${b}" data-r="${i}" data-s="${j}" aria-label="${esc(r.label)} ${s.time}, ${ST[s.status].label}">
    <span>${s.time}</span><span class="st">${ST[s.status].svg}</span></button>`;
}

function render() {
  const d = new Date(Date.parse(state.date + "T12:00:00Z"));
  $("#dateLabel").textContent = `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}, ${DAYS[d.getUTCDay()]}`;
  const t = todayStr();
  $("#dayName").textContent = state.date === t ? "Bugün" : state.date === shift(t, -1) ? "Dün" : state.date === shift(t, 1) ? "Yarın" : `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()].slice(0, 3)}`;
  $("#fAll").classList.toggle("on", state.filter === "all");
  $("#fMiss").classList.toggle("on", state.filter === "miss");

  const data = state.data;
  const notices = [];
  if (state.error) notices.push(state.error);
  if (!data) { $("#cards").innerHTML = `<div class="empty">${state.loading ? "Yükleniyor…" : "Veri yok."}</div>`; $("#notices").innerHTML = notices.map((n) => `<div class="notice">${esc(n)}</div>`).join(""); return; }

  const c = data.counts, known = c.done + c.ready + c.todo;
  const p1 = known ? (c.done / known) * 100 : 0, p2 = known ? ((c.done + c.ready) / known) * 100 : 0;
  $("#ring").style.background = known ? `conic-gradient(var(--done) 0 ${p1}%, var(--ready) ${p1}% ${p2}%, var(--todo) ${p2}% 100%)` : "#E7E5E4";
  $("#ringTxt").textContent = `${c.done}/${known}`;
  $("#ring").setAttribute("aria-label", `${known} paylaşımdan ${c.done} tanesi paylaşıldı, ${c.ready} hazır, ${c.todo} eksik`);

  const missingKeys = (data.warnings || []).filter((w) => w.message === "missing_key").map((w) => w.source);
  if (missingKeys.includes("buf:engrow")) notices.push("Engrow ve Pofu Kids için Buffer anahtarı henüz eklenmedi, o yüzden gri görünüyor.");
  const other = (data.warnings || []).filter((w) => w.message !== "missing_key");
  if (other.length) notices.push("Bazı kanallardan veri alınamadı: " + other.map((w) => w.source.replace("buf:", "Buffer ").replace("yt:", "YouTube ")).join(", "));
  $("#notices").innerHTML = notices.map((n) => `<div class="notice">${esc(n)}</div>`).join("");

  // siradaki
  const now = Date.now(), isToday = state.date === t;
  let nextT = null, nextList = [];
  if (isToday) {
    const nowHM = new Date(now + 3 * 3600e3).toISOString().slice(11, 16);
    for (const b of data.brands) for (const r of b.rows) for (const s of r.slots) {
      if (s.status === "done" || s.status === "unknown" || s.time <= nowHM) continue;
      if (!nextT || s.time < nextT) { nextT = s.time; nextList = []; }
      if (s.time === nextT) nextList.push({ b, r, s });
    }
  }
  if (nextT) {
    const names = [...new Set(nextList.map((x) => x.b.name))].join(", ");
    const red = nextList.filter((x) => x.s.status === "todo").length;
    $("#next").innerHTML = `<div class="t">${nextT}</div><div class="l">Sıradaki: <b>${esc(names)}</b><br>${nextList.length} paylaşım${red ? `, ${red} tanesi henüz hazır değil` : ", hepsi hazır"}</div>`;
    $("#next").classList.remove("hidden");
  } else $("#next").classList.add("hidden");

  const probs = [];
  data.brands.forEach((b, bi) => b.rows.forEach((r, ri) => r.slots.forEach((s, si) => { if (s.problem) probs.push({ b, r, s, bi, ri, si }); })));
  if (probs.length) {
    $("#probs").innerHTML = `<h2>Sorunlar <i>${probs.length}</i></h2>` + probs.map(({ b, r, s, bi, ri, si }) =>
      `<button class="prob" data-b="${bi}" data-r="${ri}" data-s="${si}"><span class="w">${esc(b.name)} · ${esc(r.label)} · ${s.time}</span><span class="r">${esc(s.problem.reason)}</span><span class="f">${esc(s.problem.fix)}</span></button>`).join("");
    $("#probs").classList.remove("hidden");
  } else $("#probs").classList.add("hidden");

  const html = [];
  data.brands.forEach((b, bi) => {
    const rows = b.rows.map((r, ri) => ({ r, ri, slots: r.slots.map((s, si) => ({ s, si })).filter(({ s }) => state.filter === "all" || s.status === "todo" || s.status === "ready") })).filter((x) => x.slots.length);
    if (!rows.length) return;
    const bc = b.counts, total = bc.done + bc.ready + bc.todo + bc.unknown;
    const parts = [];
    if (bc.done) parts.push(`${bc.done} paylaşıldı`);
    if (bc.ready) parts.push(`${bc.ready} hazır`);
    if (bc.todo) parts.push(`${bc.todo} eksik`);
    if (bc.unknown && !parts.length) parts.push("bağlantı bekliyor");
    const worst = bc.todo ? "todo" : bc.ready ? "ready" : bc.done ? "done" : "unknown";
    const logo = `<div class="logo" style="background:${b.color}">${esc(b.mono)}${b.avatar ? `<img src="${esc(b.avatar)}" alt="" onerror="this.remove()">` : ""}</div>`;
    html.push(`<article class="card">
      <div class="head">${logo}
        <div><div class="n">${esc(b.name)}</div><div class="s">${total} paylaşım · ${parts.join(", ")}</div></div>
        <div class="badge" style="background:var(--${worst === "unknown" ? "unk" : worst})" role="img" aria-label="${ST[worst].label}">${ST[worst].svg}</div>
      </div>
      <div class="rows">${rows.map(({ r, ri, slots }) => `
        <div class="row">
          <div class="plat"><div class="pdot" style="background:${PLAT[r.platform].color}">${PLAT[r.platform].svg}</div><span>${esc(r.label)}</span></div>
          <div class="chips">${slots.map(({ s, si }) => chip(bi, r, s, ri, si)).join("")}</div>
        </div>`).join("")}
      </div>
    </article>`);
  });
  $("#cards").innerHTML = html.length ? html.join("") : `<div class="empty">Eksik paylaşım yok.</div>`;
  const g = new Date(Date.parse(data.generatedAt) + 3 * 3600e3).toISOString().slice(11, 16);
  $("#updated").textContent = "Son güncelleme " + g;
}

// ------------------------------------------------ detay
function openSheet(e) {
  const el = e.target.closest(".chip, .prob"); if (!el) return;
  const b = state.data.brands[+el.dataset.b], r = b.rows[+el.dataset.r], s = r.slots[+el.dataset.s];
  const cls = s.status === "unknown" ? "unk" : s.status;
  $("#sheetBody").innerHTML = `
    <div class="k">${esc(b.name)} · ${esc(r.label)}${s.extra ? " · ek gönderi" : ""}</div>
    <div class="big">${s.time}</div>
    <div class="pill" style="background:var(--${cls}-bg);color:var(--${cls}-ink)">${esc(s.note || ST[s.status].label)}</div>
    ${s.title ? `<div class="ttl">${esc(s.title)}</div>` : ""}
    ${s.problem ? `<div class="fix"><b>Ne yapmalı:</b> ${esc(s.problem.fix)}</div>` : ""}
    ${s.problem?.raw ? `<div class="raw">Buffer: ${esc(s.problem.raw)}</div>` : ""}
    <button class="primary" id="closeSheet">Kapat</button>`;
  $("#sheet").classList.remove("hidden");
  $("#closeSheet").onclick = () => $("#sheet").classList.add("hidden");
}
$("#cards").addEventListener("click", openSheet);
$("#probs").addEventListener("click", openSheet);
$("#sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") $("#sheet").classList.add("hidden"); });

// ------------------------------------------------ kontroller
$("#refresh").onclick = () => load(true);
$("#prevDay").onclick = () => { state.date = shift(state.date, -1); state.data = null; render(); load(); };
$("#nextDay").onclick = () => { state.date = shift(state.date, 1); state.data = null; render(); load(); };
$("#fAll").onclick = () => { state.filter = "all"; render(); };
$("#fMiss").onclick = () => { state.filter = "miss"; render(); };
document.addEventListener("visibilitychange", () => { if (!document.hidden && !$("#app").classList.contains("hidden")) load(); });
setInterval(() => { if (!document.hidden && !$("#app").classList.contains("hidden") && state.date === todayStr()) load(); }, 90e3);

if ("serviceWorker" in navigator && !demo) navigator.serviceWorker.register("sw.js").catch(() => {});
start();
</script>
</body>
</html>
